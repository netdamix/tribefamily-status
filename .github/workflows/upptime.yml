name: Upptime
on:
  schedule:
    - cron: "0,5,10,15,20,25,30,35,40,45,50,55 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  uptime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Check response times
        uses: upptime/uptime-monitor@master
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
      - name: Remove old site directory
        run: rm -rf site
      - name: Generate status website
        uses: upptime/uptime-monitor@master
        with:
          command: site
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
      - name: Generate summary
        uses: upptime/uptime-monitor@master
        with:
          command: summary
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
      - name: Inject Tribe Family brand CSS
        # 2026-05-17 — Upptime regenerates the whole `site/` dir from
        # @upptime/uptime-monitor each run (cf. `rm -rf site` above), so
        # any custom CSS committed under `site/static/global.css` is
        # wiped. We keep the override at `custom/global.css` at the repo
        # root (untouched by the cleanup) and copy it into the freshly
        # generated export dir right before deploy.
        run: |
          if [ -f custom/global.css ]; then
            cp custom/global.css site/status-page/__sapper__/export/global.css
            echo "✓ Brand CSS injected ($(wc -c < custom/global.css) bytes)"
          else
            echo "::warning::custom/global.css not found — using default Upptime theme"
          fi
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GH_PAT }}
          publish_dir: ./site/status-page/__sapper__/export
          cname: status.mytribefamily.com
