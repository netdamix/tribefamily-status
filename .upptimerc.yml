owner: netdamix
repo: tribefamily-status

# 2026-05-17. Cleanup post-launch.
# - n8n removed (decommissioned 2026-03, replaced by Bull crons)
# - Marketing site, Dashboard and API monitored separately
# - Status page monitors itself
sites:
  - name: Marketing
    url: https://mytribefamily.com
    expectedStatusCodes:
      - 200
      - 403
    icon: https://mytribefamily.com/favicon.ico
  - name: Dashboard
    url: https://mytribefamily.com/dashboard
    expectedStatusCodes:
      - 200
      - 302
      - 307
    icon: https://mytribefamily.com/favicon.ico
  - name: API Backend
    url: https://api.mytribefamily.com/api/v1/health
    icon: https://mytribefamily.com/favicon.ico
  - name: Status page
    url: https://status.mytribefamily.com
    icon: https://mytribefamily.com/favicon.ico

assignees:
  - netdamix

status-website:
  cname: status.mytribefamily.com
  logoUrl: https://mytribefamily.com/images/Logo-transparent.png
  name: "Tribe Family Status"
  introTitle: "**Tribe Family** real-time monitoring"
  introMessage: "This page shows the current status of our services in real time, refreshed every 5 minutes. For any incident or question, reach us at [hello@mytribefamily.com](mailto:hello@mytribefamily.com)."
  navbar:
    - title: Home
      href: /
    - title: Tribe Family site
      href: https://mytribefamily.com
    - title: Source
      href: https://github.com/netdamix/tribefamily-status

i18n:
  activeIncidents: Active incidents
  allSystemsOperational: All systems are operational
  incidentReport: "Incident report:"
  scheduledMaintenance: Scheduled maintenance
  pastIncidents: Past incidents
  status: Status
  description: Description
  responseTime: Response time
  uptime: Uptime
  last7Days: 7d
  last30Days: 30d
  last1Year: 1y
  liveStatus: Live status
  history: Uptime history
  footer: "© Tribe Family. Data refreshed every 5 min."
